name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check if release is needed
        id: check_release
        run: |
          set -euo pipefail

          VERSION=$(grep -oP "Version:\s*\K\d+(\.\d+)*" mollie-terminal-for-woocommerce.php)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git fetch --prune --tags

          if ! git tag | grep -qx "v$VERSION"; then
            echo "Version has changed. Creating new release..."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx 'mollie-terminal-for-woocommerce.zip'; then
            echo "Release exists without ZIP asset. Rebuilding and uploading asset..."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version has not changed and ZIP asset already exists. Skipping release..."
          echo "release=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install composer dependencies
        if: steps.check_release.outputs.release == 'true'
        run: composer install --no-dev

      - name: Build ZIP
        if: steps.check_release.outputs.release == 'true'
        run: |
          # WordPress 7.1.4+ unpacks packages into a randomly suffixed folder and installs a flat zip
          # there, so the zip must hold the installed folder (catalog slug) as its only top-level entry.
          mkdir -p "$RUNNER_TEMP/stage/mollie-terminal-for-woocommerce"
          rsync -a --exclude='.git*' ./ "$RUNNER_TEMP/stage/mollie-terminal-for-woocommerce/"
          (cd "$RUNNER_TEMP/stage" && zip -r "$GITHUB_WORKSPACE/mollie-terminal-for-woocommerce.zip" "mollie-terminal-for-woocommerce" -x "*.git*")
          TOP_LEVEL=$(unzip -Z1 mollie-terminal-for-woocommerce.zip | cut -d/ -f1 | sort -u)
          if [ "$TOP_LEVEL" != "mollie-terminal-for-woocommerce" ]; then
            echo "::error::mollie-terminal-for-woocommerce.zip must contain only mollie-terminal-for-woocommerce/ at the top level, found: $TOP_LEVEL"
            exit 1
          fi

      - name: Create release and upload ZIP
        if: steps.check_release.outputs.release == 'true'
        run: |
          set -euo pipefail

          NOTES_FILE="docs/releases/$VERSION.md"
          NOTES_ARGS=(--notes "Release v$VERSION")
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" mollie-terminal-for-woocommerce.zip --clobber
            gh release edit "v$VERSION" "${NOTES_ARGS[@]}"
          else
            gh release create "v$VERSION" \
              mollie-terminal-for-woocommerce.zip \
              --title "Release v$VERSION" \
              "${NOTES_ARGS[@]}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
