name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 7.4 is the plugin's minimum supported PHP version.
        php: ['7.4', '8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'

      - name: Lint (php -l on every file)
        run: |
          set -euo pipefail
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Regression tests
        run: |
          set -euo pipefail
          for f in tests/regression/*.php; do
            echo "== $f"
            php "$f"
          done
          node tests/regression/payment-js.js

  conformance:
    name: Conformance PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: mollie-terminal-for-woocommerce
    steps:
      - name: Checkout extension
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: mollie-terminal-for-woocommerce
          persist-credentials: false

      # Pro's provider conformance suite runs the real adapter under wp-env with Pro (which vendors
      # Free) as a sibling plugin; see tests/conformance/. The org-level wcpos-bot App mints a token
      # scoped to contents:read on the private Pro repo. Fork PRs get no secrets and stop here by design.
      - name: Read-only Pro token
        id: pro-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WCPOS_BOT_APP_ID }}
          private-key: ${{ secrets.WCPOS_BOT_PRIVATE_KEY }}
          owner: wcpos
          repositories: woocommerce-pos-pro
          permission-contents: read

      - name: Checkout Pro next as sibling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wcpos/woocommerce-pos-pro
          ref: next
          path: woocommerce-pos-pro
          token: ${{ steps.pro-token.outputs.token }}
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer install --working-dir=../woocommerce-pos-pro --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'

      - name: Start WordPress test environment
        run: |
          npm i -g @wordpress/env
          printf '{"phpVersion":"%s"}\n' '${{ matrix.php }}' > .wp-env.override.json
          wp-env start

      # Transcripts are compared, never recorded, here: recording is an opt-in inside the PHPUnit
      # process (`wp-env run tests-cli -- env WCPOS_RECORD_TRANSCRIPTS=1 ...`) that CI does not set.
      - name: Provider conformance suite
        run: wp-env run --env-cwd='wp-content/plugins/mollie-terminal-for-woocommerce' tests-cli -- vendor/bin/phpunit -c phpunit.conformance.xml.dist
